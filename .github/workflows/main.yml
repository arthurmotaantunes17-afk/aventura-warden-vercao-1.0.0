name: Gerador de APK do THUZYN

on:
  push:
    branches: [ main ]

jobs:
  android-build:
    name: Criando o Aplicativo Real
    runs-on: ubuntu-latest

    steps:
    - name: Pegando os códigos do Arthur
      uses: actions/checkout@v4

    - name: Configurando o Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurando as ferramentas do Android
      uses: android-actions/setup-android@v3

    - name: Instalando o Transformador (Cordova)
      run: npm install -g cordova

    - name: Construindo o APK na Nuvem
      run: |
        cordova create projeto com.thuzyn123.aventurawarden "Aventura Warden Beta"
        # Isso vai copiar TUDO o que estiver na raiz para dentro do projeto
        # Menos a própria pasta do projeto para evitar erro
        find . -maxdepth 1 -not -name 'projeto' -not -name '.' -exec cp -r {} projeto/www/ \;
        cd projeto
        cordova platform add android
        cordova build android --no-telemetry

    - name: Guardando o arquivo para o Arthur baixar
      uses: actions/upload-artifact@v4
      with:
        name: Jogo-Do-Warden-APK
        path: projeto/platforms/android/app/build/outputs/apk/**/*.apk